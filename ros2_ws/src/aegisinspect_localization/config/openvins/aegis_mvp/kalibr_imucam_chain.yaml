%YAML:1.0

cam0:
  # OpenVINS convention:
  # rotation from camera optical frame to IMU, R_CtoI
  # position of camera origin expressed in IMU frame, p_CinI
  T_imu_cam:
    - [ 0.0,  0.0,  1.0, 0.25]
    - [-1.0,  0.0,  0.0, 0.00]
    - [ 0.0, -1.0,  0.0, 0.00]
    - [ 0.0,  0.0,  0.0, 1.00]

  cam_overlaps: []
  camera_model: pinhole

  distortion_coeffs: [0.0, 0.0, 0.0, 0.0]
  distortion_model: radtan

  intrinsics:
    [554.2562866210938, 554.2563056945801, 320.0, 240.0]

  resolution: [640, 480]

  rostopic: /aegis/sensors/camera/image_raw

  timeshift_cam_imu: 0.0
