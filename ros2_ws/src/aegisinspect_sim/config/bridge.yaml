# Gazebo -> ROS only. Preserve sensor timestamps; no TF/odometry bridge.
- ros_topic_name: /clock
  gz_topic_name: /world/inspection_bay/clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
  qos_profile: CLOCK
  lazy: false
- ros_topic_name: /aegis/sensors/camera/image_raw
  gz_topic_name: /aegis/sim/sensors/camera/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: false
- ros_topic_name: /aegis/perception/depth/image
  gz_topic_name: /aegis/sim/sensors/camera/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: false
- ros_topic_name: /aegis/sensors/camera/camera_info
  gz_topic_name: /aegis/sim/sensors/camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: false
- ros_topic_name: /aegis/sensors/imu/data
  gz_topic_name: /aegis/sim/sensors/imu/data
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: false
- ros_topic_name: /aegis/sensors/lidar/points
  gz_topic_name: /aegis/sim/sensors/lidar/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: false
