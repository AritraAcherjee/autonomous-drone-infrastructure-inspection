  augment: false
reproducibility:
  git: true
  environment: true
  requested_config: true
  resolved_config: true
low_light:
  enabled: true
  in_memory_only: true
  source_split: train
  global_seed: 42
  placement: after_geometry_and_hue_saturation_before_format
  source_identity: primary_record.image_relative_path
  epoch: zero_based_trainer_epoch
  normal_probability: 0.5
  low_light_probability: 0.5
  overall_probabilities:
    Normal: 0.5
    Mild: 0.2
    Moderate: 0.15
    Heavy: 0.1
    Extreme: 0.05
  conditional_probabilities:
    Mild: 0.4
    Moderate: 0.3
    Heavy: 0.2
    Extreme: 0.1
  ranges:
    Mild:
      brightness:
      - 0.78
      - 0.92
      gamma:
      - 1.05
      - 1.15
      contrast:
      - 0.92
      - 1.0
      noise_sigma:
      - 1.0
      - 3.0
      blur_sigma:
      - 0.0
      - 0.4
      illumination_attenuation:
      - 0.04
      - 0.1
    Moderate:
      brightness:
      - 0.6
      - 0.78
      gamma:
      - 1.1
      - 1.3
      contrast:
      - 0.85
      - 0.95
      noise_sigma:
      - 3.0
      - 6.0
      blur_sigma:
      - 0.2
      - 0.7
      illumination_attenuation:
      - 0.1
      - 0.18
    Heavy:
      brightness:
      - 0.42
      - 0.6
      gamma:
      - 1.2
      - 1.5
      contrast:
      - 0.75
      - 0.9
      noise_sigma:
      - 6.0
      - 10.0
      blur_sigma:
      - 0.5
      - 1.1
      illumination_attenuation:
      - 0.18
      - 0.3
    Extreme:
      brightness:
      - 0.28
      - 0.45
      gamma:
      - 1.35
      - 1.75
      contrast:
      - 0.65
      - 0.82
      noise_sigma:
      - 10.0
      - 14.0
      blur_sigma:
      - 0.8
      - 1.5
      illumination_attenuation:
      - 0.28
      - 0.42
  sampling: uniform
  rng:
    template: LL-DETECTOR-01|42|train|{source_relative_posix_path}|epoch={epoch}
    path_separators: /
    case: preserved
    encoding: utf-8
    hash: sha256
    digest_bytes: 8
    byteorder: big
    signed: false
    generator: np.random.default_rng
    draw_order:
    - normal_or_low_light
    - severity
    - brightness
    - gamma
    - contrast
    - illumination_attenuation
    - cx
    - cy
    - axis_x
    - axis_y
    - theta
    - blur_sigma
    - noise_sigma
    - gaussian_noise_realization
    normal_interval: '[0, 0.5)'
    conditional_intervals:
      Mild: '[0, 0.4)'
      Moderate: '[0.4, 0.7)'
      Heavy: '[0.7, 0.9)'
      Extreme: '[0.9, 1)'
  mathematics:
    input:
      color_space: BGR
      dtype: uint8
    working:
      dtype: float32
      range:
      - 0.0
      - 1.0
    operation_order:
    - brightness
    - gamma
    - contrast
    - smooth_uneven_illumination
    - gaussian_blur
    - gaussian_sensor_noise
    - clip
    - uint8_round
    brightness: x * brightness
    gamma: x ** gamma
    contrast:
      mean: current_per_channel
      axes:
      - 0
      - 1
      keepdims: true
      formula: mu + contrast * (x - mu)
      clip:
      - 0.0
      - 1.0
    illumination:
      kind: single_rotated_elliptical_attenuation
      sample_order:
      - cx
      - cy
      - axis_x
      - axis_y
      - theta
      cx_width_fraction:
      - 0.25
      - 0.75
      cy_height_fraction:
      - 0.25
      - 0.75
      axis_x_width_fraction:
      - 0.35
      - 0.7
      axis_y_height_fraction:
      - 0.35
      - 0.7
      theta_radians: '[0, pi)'
      rotation: xr = cos(theta)*dx + sin(theta)*dy; yr = -sin(theta)*dx + cos(theta)*dy
      r2: (xr / axis_x) ** 2 + (yr / axis_y) ** 2
      field: 1.0 - attenuation * exp(-0.5 * r2)
      shared_across_channels: true
    blur:
      kind: gaussian
      backend: opencv
      kernel_size:
      - 0
      - 0
      border_type: BORDER_REFLECT_101
    output:
      clip:
      - 0.0
      - 1.0
      conversion: np.rint(x * 255.0).astype(np.uint8)
  noise:
    kind: gaussian
    mean: 0.0
    sigma_units: uint8_intensity
    sample_shape: HWC
